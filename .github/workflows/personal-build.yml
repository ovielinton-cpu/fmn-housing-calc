name: Personal Build (with notification capture)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.44.8' }

      - name: Install Flet
        run: pip install flet

      - name: Build base app (generates build/flutter)
        run: flet build apk --yes

      - name: Patch in notification capture
        run: python android_native/patch_android_project.py --project-root build/flutter

      - name: Rebuild via Flet (reuses existing build/flutter, keeps the patch)
        run: flet build apk --yes

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-build-apk
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
