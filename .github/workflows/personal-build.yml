name: Personal Build (with notification capture)

on:
  workflow_dispatch:   # gives you a manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Install Flet
        run: pip install flet

      - name: Build base app (generates build/flutter)
        run: flet build apk

      - name: Patch in notification capture
        run: python android_native/patch_android_project.py --project-root build/flutter

      - name: Rebuild with the patch included
        working-directory: build/flutter
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-build-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
