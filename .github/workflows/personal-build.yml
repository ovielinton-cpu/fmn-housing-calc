name: Personal Build (with notification capture)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Install Flet and dependencies
        run: pip install flet==0.83.0 flet-ads flet-audio fpdf2

      # Own package name, so it installs next to the Google Play version and Play never
      # tries to "update" it. It shows Google's test ads (see is_personal_build in main.py).
      - name: Build app with notification-capture template
        run: >
          flet build apk --yes
          --template https://github.com/ovielinton-cpu/flet-android-template
          --template-ref main
          --bundle-id com.linton.naira_finance_hub.personal
          --product "Naira Hub (Personal)"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-build-apk
          path: build/apk/*.apk
