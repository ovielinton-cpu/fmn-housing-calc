name: Generate Upload Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass "NairaFinance2026!" \
            -keypass "NairaFinance2026!" \
            -dname "CN=Naira Finance Hub, OU=Dev, O=Linton, L=Lagos, ST=Lagos, C=NG"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
